name: Obsidia Tools Android CI & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Ensure Release Signing Keystore
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Obsidia, OU=Tools, O=Zucchero, L=Jakarta, ST=Jakarta, C=ID"
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"

      - name: Locate & Verify APK Outputs
        id: apk-locate
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/ObsidiaTools-debug.apk
            sha256sum build-artifacts/ObsidiaTools-debug.apk > build-artifacts/ObsidiaTools-debug.apk.sha256
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/ObsidiaTools-v1.0.1.apk
            sha256sum build-artifacts/ObsidiaTools-v1.0.1.apk > build-artifacts/ObsidiaTools-v1.0.1.apk.sha256
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/ObsidiaTools-v1.0.1.apk
            sha256sum build-artifacts/ObsidiaTools-v1.0.1.apk > build-artifacts/ObsidiaTools-v1.0.1.apk.sha256
          fi
          echo "Verified generated artifacts:"
          ls -lh build-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsidia-tools-apk
          path: build-artifacts/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            build-artifacts/*.apk
            build-artifacts/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
